<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ComojueCamCloud{% endblock %}</title>
    <style>
        :root {
            --fg: #33ff33;
            --fg-dim: #1a7a1a;
            --fg-bright: #66ff66;
            --accent: #66ffff;
            --bg: #001100;
            --bg-card: #002200;
            --border: #33ff33;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: ui-monospace, 'Cascadia Code', 'Source Code Pro', Consolas, 'Liberation Mono', monospace;
            background-color: var(--bg);
            color: var(--fg);
            padding: 1.5em;
            line-height: 1.6;
            font-size: 14px;
        }

        .crt { max-width: 120ch; margin: 0 auto; }

        a {
            color: var(--accent);
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        a:hover, a:focus {
            background-color: var(--fg);
            color: var(--bg);
            outline: 2px solid var(--fg);
            outline-offset: 2px;
        }

        h1, h2, h3 {
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--fg-bright);
            font-weight: 700;
        }

        h1 {
            font-size: 1.6em;
            border-bottom: 2px solid var(--border);
            padding-bottom: 0.4em;
            margin-bottom: 1em;
        }

        h2 {
            font-size: 1.2em;
            margin-bottom: 0.6em;
        }

        h3 {
            font-size: 1em;
            margin-bottom: 0.5em;
            color: var(--fg);
        }

        .banner {
            text-align: center;
            margin-bottom: 1.5em;
            color: var(--fg-bright);
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            white-space: pre;
            line-height: 1.2;
        }

        .cursor {
            animation: blink 1s step-start infinite;
            color: var(--fg-bright);
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        .breadcrumb {
            margin-bottom: 1em;
            color: var(--fg-dim);
            font-size: 0.9em;
        }

        .breadcrumb a {
            color: var(--fg-dim);
            text-decoration: underline;
        }

        .breadcrumb a:hover {
            color: var(--bg);
            background-color: var(--fg-dim);
        }

        .prompt {
            color: var(--fg-bright);
            font-weight: 700;
        }

        .box {
            border: 2px solid var(--border);
            padding: 1em;
            margin-bottom: 1em;
            background-color: var(--bg-card);
            position: relative;
        }

        .box-header {
            text-transform: uppercase;
            letter-spacing: 0.15em;
            font-size: 0.85em;
            color: var(--fg-bright);
            margin-bottom: 0.6em;
            font-weight: 700;
        }

        .box-label {
            color: var(--fg-dim);
            font-size: 0.85em;
        }

        .box:hover {
            border-color: var(--fg-bright);
        }

        .client-list {
            display: flex;
            flex-direction: column;
            gap: 0.8em;
        }

        .client-entry {
            border: 1px solid var(--border);
            padding: 0.8em 1em;
            display: flex;
            align-items: baseline;
            gap: 1em;
            flex-wrap: wrap;
            background-color: var(--bg-card);
        }

        .client-entry:hover {
            background-color: var(--fg);
            color: var(--bg);
            border-color: var(--fg);
        }

        .client-entry:hover a {
            color: var(--bg);
        }

        .client-entry:hover .box-label {
            color: var(--bg);
        }

        .token {
            font-weight: 700;
            color: var(--fg-bright);
            font-size: 1.1em;
            letter-spacing: 0.08em;
        }

        .client-entry:hover .token {
            color: var(--bg);
        }

        .meta {
            font-style: italic;
            color: var(--fg-dim);
            font-size: 0.85em;
        }

        .client-entry:hover .meta {
            color: var(--bg);
        }

        .status-on {
            color: var(--fg-bright);
            font-weight: 700;
        }

        .client-entry:hover .status-on {
            color: var(--bg);
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin: 0.5em 0;
        }

        .data-table th,
        .data-table td {
            padding: 0.4em 1em;
            text-align: left;
            border-bottom: 1px solid var(--fg-dim);
        }

        .data-table th {
            color: var(--fg-dim);
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 400;
        }

        .data-table td {
            color: var(--fg-bright);
            font-weight: 700;
        }

        .category-grid {
            display: flex;
            flex-direction: column;
            gap: 1em;
        }

        .telemetry-info {
            color: var(--fg-dim);
            margin-bottom: 1.5em;
            font-size: 0.9em;
        }

        .telemetry-info span {
            color: var(--fg-bright);
            font-weight: 700;
        }

        .batch-list {
            display: flex;
            flex-direction: column;
            gap: 0.6em;
        }

        .batch-item {
            border: 1px solid var(--border);
            padding: 0.6em 1em;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 1em;
            background-color: var(--bg-card);
        }

        .batch-item:hover {
            background-color: var(--fg);
            color: var(--bg);
            border-color: var(--fg);
        }

        .batch-item:hover a { color: var(--bg); }
        .batch-item:hover .box-label { color: var(--bg); }

        .batch-time {
            font-weight: 700;
            color: var(--fg-bright);
            letter-spacing: 0.1em;
        }

        .batch-item:hover .batch-time { color: var(--bg); }

        .empty {
            text-align: center;
            padding: 3em 1em;
            color: var(--fg-dim);
            border: 1px dashed var(--fg-dim);
        }

        .empty p {
            font-style: italic;
            margin-top: 1em;
        }

        .error-box {
            border: 2px solid var(--fg-bright);
            padding: 2em;
            margin-top: 4em;
            text-align: center;
            background-color: var(--bg-card);
        }

        .error-box h1 {
            font-size: 3em;
            border: none;
            margin-bottom: 0.3em;
            letter-spacing: 0.3em;
        }

        .error-box p {
            font-style: italic;
            color: var(--fg-dim);
            margin-bottom: 1.5em;
        }

        .error-box a {
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.15em;
        }

        .sep {
            color: var(--fg-dim);
            letter-spacing: 0.2em;
            user-select: none;
        }

        @media (max-width: 600px) {
            body { padding: 0.8em; font-size: 13px; }
            h1 { font-size: 1.2em; }
            .banner { font-size: 0.7em; }
        }
    </style>
</head>
<body>
    <div class="crt">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
